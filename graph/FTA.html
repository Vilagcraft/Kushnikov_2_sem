<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FTA: Анализ дерева отказов</title>
    <style>
    :root {
        --bg: #f4f7fb;
        --bg-2: #eaf2ff;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-solid: #ffffff;
        --surface-soft: #f8fafc;
        --text: #142033;
        --muted: #64748b;
        --border: #dbe5f0;
        --border-strong: #cbd5e1;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-soft: #dbeafe;
        --success: #16a34a;
        --success-soft: #dcfce7;
        --warning: #f59e0b;
        --warning-dark: #d97706;
        --warning-soft: #fef3c7;
        --danger: #ef4444;
        --danger-soft: #fee2e2;
        --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 18px 45px rgba(15, 23, 42, 0.10);
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 12px;
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(circle at 10% 8%, rgba(37, 99, 235, 0.14), transparent 32%),
            radial-gradient(circle at 92% 4%, rgba(20, 184, 166, 0.12), transparent 34%),
            linear-gradient(135deg, var(--bg), var(--bg-2));
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(15, 23, 42, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
        background-size: 36px 36px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.38), transparent 62%);
        z-index: -1;
    }

    header {
        margin: 22px 24px 0;
        padding: 22px 26px;
        border: 1px solid rgba(219, 229, 240, 0.9);
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.88));
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        color: var(--text);
        font-size: 0;
    }

    header::before {
        content: "FTA";
        display: inline-grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--primary), #14b8a6);
        color: white;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        box-shadow: 0 12px 26px rgba(37, 99, 235, 0.28);
    }

    header::after {
        content: "Прогнозирование характеристик безопасности авиационных транспортных систем";
        flex: 1 1 420px;
        font-size: 1.35rem;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.03em;
    }

    main {
        flex: 1;
        width: min(100%, 1480px);
        margin: 0 auto;
        padding: 20px 24px 32px;
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        background: var(--surface-solid);
        color: var(--text);
        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }

    button:hover {
        transform: translateY(-1px);
        border-color: var(--border-strong);
        box-shadow: 0 9px 18px rgba(15, 23, 42, 0.08);
    }

    button:active {
        transform: translateY(0);
    }

    button.primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-color: transparent;
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.23);
    }

    button.primary:hover {
        background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
    }

    button.success {
        background: linear-gradient(135deg, var(--success), #15803d);
        color: white;
        border-color: transparent;
    }

    button.warning {
        background: linear-gradient(135deg, var(--warning), var(--warning-dark));
        color: white;
        border-color: transparent;
    }

    button.secondary {
        background: linear-gradient(135deg, #0f766e, #115e59);
        color: white;
        border-color: transparent;
    }

    button.outline {
        background: rgba(255,255,255,0.75);
        color: var(--primary-dark);
        border-color: #bfdbfe;
    }

    button.outline:hover {
        background: var(--primary-soft);
        border-color: #93c5fd;
    }

    .tabs {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px;
        margin-bottom: 14px;
        border: 1px solid rgba(219, 229, 240, 0.9);
        border-radius: var(--radius-lg);
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow-sm);
    }

    .tab-btn {
        background: transparent;
        border-radius: 999px;
        padding: 11px 18px;
        font-weight: 800;
        color: var(--muted);
        border: 1px solid transparent;
        margin-bottom: 0;
        font-size: 14px;
        box-shadow: none;
    }

    .tab-btn:hover {
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary-dark);
        box-shadow: none;
    }

    .tab-btn.active {
        background: var(--surface-solid);
        color: var(--primary-dark);
        border-color: #bfdbfe;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.11);
    }

    .tab {
        display: none;
        background: var(--surface);
        padding: 20px;
        border: 1px solid rgba(219, 229, 240, 0.92);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(14px);
    }

    .tab.active {
        display: block;
        animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .param-panel {
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.95), rgba(240, 253, 250, 0.9));
        border: 1px solid #bfdbfe;
        border-radius: var(--radius-lg);
        padding: 18px;
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        box-shadow: var(--shadow-sm);
    }

    .param-panel label {
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #1e3a8a;
        background: rgba(255,255,255,0.72);
        border: 1px solid rgba(191,219,254,0.8);
        padding: 9px 12px;
        border-radius: 999px;
        white-space: nowrap;
    }

    .range-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #1e3a8a;
        background: rgba(255,255,255,0.76);
        border: 1px solid rgba(191,219,254,0.9);
        padding: 8px 10px 8px 13px;
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
        white-space: nowrap;
    }

    .range-title {
        font-weight: 900;
        margin-right: 2px;
    }

    .range-bound {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
        color: #31518f;
    }

    .range-separator {
        width: 1px;
        height: 26px;
        background: #bfdbfe;
        margin: 0 2px;
    }

    .param-panel input,
    .history-table input,
    .speed-select {
        padding: 9px 11px;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: #ffffff;
        width: 92px;
        text-align: center;
        font-weight: 800;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
        font-size: 13px;
        color: var(--text);
    }

    .param-panel input:focus,
    .history-table input:focus,
    .speed-select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .history-table-container,
    .docs-table-container {
        max-height: 560px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-solid);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .history-table,
    .docs-table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 13px;
        min-width: 920px;
    }

    .history-table {
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    .history-table th,
    .history-table td,
    .docs-table th,
    .docs-table td {
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 12px 11px;
        text-align: center;
        vertical-align: middle;
        background: rgba(255,255,255,0.98);
    }

    .docs-table th,
    .docs-table td {
        text-align: left;
        vertical-align: top;
    }

    .history-table tr:nth-child(even) td,
    .docs-table tr:nth-child(even) td {
        background: #f8fafc;
    }

    .history-table tr:hover td,
    .docs-table tr:hover td {
        background: #eff6ff;
    }

    .history-table th,
    .docs-table th {
        font-weight: 900;
        position: sticky;
        top: 0;
        font-size: 12px;
        background: linear-gradient(180deg, #f8fafc, #eef6ff);
        z-index: 900;
        color: #1e3a8a;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .history-table td:first-child,
    .docs-table td:first-child {
        font-weight: 900;
        position: sticky;
        left: 0;
        z-index: 5;
        background: #ffffff;
        box-shadow: 8px 0 14px rgba(15, 23, 42, 0.04);
    }

    .docs-table td:first-child {
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        color: var(--primary-dark);
        white-space: nowrap;
        width: 90px;
    }

    .docs-table td:nth-child(3) {
        color: var(--muted);
        width: 210px;
    }

    .docs-table td:nth-child(4) {
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        color: var(--text);
        white-space: nowrap;
    }

    .success-bg,
    .fail-bg {
        display: inline-block;
        padding: 6px 9px;
        min-width: 78px;
        border-radius: 999px;
        font-weight: 900;
        border: 1px solid transparent;
    }

    .success-bg {
        color: #166534;
        background: var(--success-soft);
        border-color: #bbf7d0;
    }

    .fail-bg {
        color: #475569;
        background: #e2e8f0;
        border-color: #cbd5e1;
    }

    .prob-label {
        font-weight: 900;
        font-size: 13px;
        color: var(--primary-dark);
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    .notification-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.30);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        backdrop-filter: blur(8px);
    }

    .notification {
        background: var(--surface-solid);
        border-radius: 24px;
        padding: 26px 32px;
        min-width: 300px;
        box-shadow: 0 28px 70px rgba(15,23,42,0.22);
        text-align: center;
        font-weight: 800;
        border: 1px solid var(--border);
        color: var(--text);
    }

    .notification.success { border-top: 6px solid var(--success); }
    .notification.error { border-top: 6px solid var(--danger); }

    .animation-controls {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.96), rgba(255,255,255,0.88));
        padding: 16px;
        border: 1px solid #bfdbfe;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
    }

    .animation-controls select,
    .animation-controls button {
        font-size: 14px;
        padding: 10px 16px;
    }

    .speed-select {
        width: auto;
        min-width: 110px;
        cursor: pointer;
    }

    .play-pause-btn {
        background: linear-gradient(135deg, var(--primary), #14b8a6);
        color: white;
        border: none;
        width: 48px;
        min-width: 48px;
        height: 42px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border-radius: 999px;
        box-shadow: 0 10px 20px rgba(37,99,235,0.22);
    }

    #canvas-container {
        background:
            linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.96));
        border: 1px solid var(--border);
        overflow: auto;
        padding: 14px;
        border-radius: var(--radius-lg);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), var(--shadow-sm);
    }

    canvas {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        display: block;
        margin: 0 auto;
        box-shadow: 0 14px 38px rgba(15, 23, 42, 0.07);
    }

    .step-indicator {
        background: #ffffff;
        padding: 10px 24px;
        font-weight: 900;
        font-size: 14px;
        color: var(--primary-dark);
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.3px;
        min-width: 130px;
        text-align: center;
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .clear-results-btn {
        background: #ffffff;
        padding: 7px 10px;
        margin-left: -4px;
        font-size: 13px;
        color: #64748b;
        border: 1px solid var(--border);
        border-radius: 999px;
        min-width: 34px;
        box-shadow: none;
    }

    .clear-results-btn:hover {
        background: var(--danger-soft);
        color: #b91c1c;
        border-color: #fecaca;
    }

    .docs-panel {
        display: grid;
        gap: 18px;
    }

    .docs-intro {
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.95), rgba(240, 253, 250, 0.88));
        border: 1px solid #bfdbfe;
        border-left: 6px solid var(--primary);
        border-radius: var(--radius-lg);
        padding: 16px 18px;
        line-height: 1.55;
        color: #1e3a8a;
        box-shadow: var(--shadow-sm);
    }

    .docs-legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
    }

    .docs-badge {
        background: rgba(255,255,255,0.82);
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        padding: 7px 11px;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        font-weight: 900;
        color: var(--primary-dark);
        box-shadow: 0 5px 14px rgba(37,99,235,0.08);
    }

    @media (max-width: 760px) {
        header,
        main {
            margin-left: 12px;
            margin-right: 12px;
            padding-left: 12px;
            padding-right: 12px;
        }
        header::after {
            font-size: 1rem;
        }
        .tab {
            padding: 12px;
        }
        .param-panel label,
        .range-group {
            width: 100%;
            justify-content: space-between;
        }

        .range-group {
            flex-wrap: wrap;
            border-radius: 18px;
        }

        .range-separator {
            display: none;
        }
    }

    </style>
</head>

        function clampProbability(value, fallback = 0) {
            const number = parseFloat(value);
            if (Number.isNaN(number)) return fallback;
            return Math.min(1, Math.max(0, number));
        }

            const minInput = document.getElementById("randomProbMin");

        function runMultipleSimulations(count) {
            simulationRuns = [];
            for (let i = 1; i <= count; i++) {
                const generatedValues = {};
                const successes = {};
                probEdges.forEach(edge => {
                    normalizeProbabilityInterval(edge.id);
                    const lower = fixedLowerBounds[edge.id];
                    const p = fixedProbs[edge.id];
                    const rand = Math.random();
                    generatedValues[edge.id] = rand;
                    successes[edge.id] = rand >= lower && rand <= p;
                });
                simulationRuns.push({ runIndex: i, generatedValues, successes });
            }
        }
        
        //Логика  отрисовки куска дерева по вероятностям (что рисуем, а что нет. основан на BFS)
        function getActiveNodesForRun(iterationIndex) {
            const candidateNodes = new Set(allNodes.map(node => node.id));
            const candidateEdges = new Set(allEdges.map(edge => edge.id));

            if (iterationIndex === 0) return {activeNodes: candidateNodes, activeEdges: candidateEdges};
            const iter = simulationRuns[iterationIndex - 1];
            if (!iter) return {activeNodes: new Set(), activeEdges: new Set()};

            for (const edge of probEdges) if (!iter.successes[edge.id]) candidateEdges.delete(edge.id);
            const logicNodes = allNodes.filter(node => node.type === "OR" || node.type === "AND").sort((a, b) => a.level - b.level);

            for (const logicNode of logicNodes) {
                const inEdges = allEdges.filter(edge => edge.target === logicNode.id);
                let removeHigher = false;
                if (logicNode.type === "OR") {
                    let count = 0;
                    for (const inEdge of inEdges){ if (!candidateEdges.has(inEdge.id)){ candidateNodes.delete(inEdge.source); count++; } }
                    removeHigher = count === inEdges.length;
                } else {
                    let flag = false;
                    for (const inEdge of inEdges) if (!candidateEdges.has(inEdge.id)) { flag = true; break; }
                    if (flag) { for (const inEdge of inEdges){ candidateEdges.delete(inEdge.id); candidateNodes.delete(inEdge.source); } removeHigher = true; }
                }
                if (removeHigher) {
                    candidateNodes.delete(logicNode.id);
                    const outEdge = allEdges.filter(edge => edge.source === logicNode.id)[0];
                    if(outEdge) { const outNode = allNodes.filter(node => node.id === outEdge.target)[0]; const outOutEdge = allEdges.filter(edge => edge.source === outNode?.id)[0]; candidateEdges.delete(outEdge.id); if(outNode) candidateNodes.delete(outNode.id); if(outOutEdge) candidateEdges.delete(outOutEdge.id); }
                }
            }

            const activeNodes = new Set();
            const activeEdges = new Set();
            const t0Node = allNodes.filter(node => node.label === "R")[0];
            if(!t0Node) return {activeNodes, activeEdges};
            let queue = [t0Node.id], visited = new Set([t0Node.id]);
            while (queue.length){
                const curr = queue.shift();
                activeNodes.add(curr);
                const inEdges = allEdges.filter(edge => edge.target === curr && candidateEdges.has(edge.id));
                for (const inEdge of inEdges) { if (!visited.has(inEdge.source)) { queue.push(inEdge.source); visited.add(inEdge.source); } activeEdges.add(inEdge.id); }
            }
            return {activeNodes, activeEdges};
        }
        
        //отрисовка конкретного шага
        function drawAnimatedTreeForRun(step) {
            const canvas = document.getElementById("animationCanvas");
            if (!canvas) return;
            canvas.width = 1040; canvas.height = 700;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            const { activeNodes, activeEdges } = getActiveNodesForRun(step);
            for (const edge of allEdges) {
                if (!activeEdges.has(edge.id)) continue;
                const src = nodeMap.get(edge.source), tgt = nodeMap.get(edge.target);
                if(!src || !tgt) continue;
                const isFromLogic = src.type === "AND" || src.type === "OR";
                drawLine(ctx, src.x, src.y, tgt.x, tgt.y, isFromLogic ? "#d97706" : "#3b82f6", isFromLogic ? 2.5 : 2);
                if (edge.prob !== null && step > 0 && simulationRuns[step-1]) drawEdgeLabel(ctx, src.x, src.y, tgt.x, tgt.y, `${fixedLowerBounds[edge.id].toFixed(2)}–${fixedProbs[edge.id].toFixed(2)}`);
            }
            for (const node of allNodes) {
                if (!activeNodes.has(node.id)) continue;
                if (node.type === "OR" || node.type === "AND") drawLogicNode(ctx, node.x, node.y, node.label, node.type);
                else drawEventNode(ctx, node.x, node.y, node.label, node.label === "R");
            }
        }
        
        //узлы событий (B1, F1,...)
        function drawEventNode(ctx, x, y, text, isR0) {
            const w = 32, h = 22;
            ctx.beginPath();
            ctx.rect(x - w/2, y - h/2, w, h);
            ctx.fillStyle = isR0 ? "#fee2e2" : "#e6f4e6";
            ctx.fill();
            ctx.strokeStyle = isR0 ? "#b91c1c" : "#6b9e42";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = isR0 ? "#991b1b" : "#2b5e2b";
            ctx.font = "500 12px 'Inter', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x, y);
        }

        //Логические узлы
        function drawLogicNode(ctx, x, y, text, type) {
            const size = 26;
            ctx.beginPath();
            ctx.rect(x - size/2, y - size/2, size, size);
            ctx.fillStyle = "#fff3e0";
            ctx.fill();
            ctx.strokeStyle = "#d97706";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = "#b86f2c";
            ctx.font = "bold 11px 'Inter', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x, y);
        }

        //Ребра
        function drawLine(ctx, x1, y1, x2, y2, color, width) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        //Текстовые метки ребер: центрируем по середине ребра.
        //В анимации значения выводятся без подложки и обводки.
        function drawEdgeLabel(ctx, x1, y1, x2, y2, val) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            let ang = Math.atan2(y2 - y1, x2 - x1);
            if (ang > Math.PI / 2 || ang < -Math.PI / 2) ang += Math.PI;

            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(ang);
            ctx.font = "700 11px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#1e3a8a";
            ctx.fillText(val, 0, -11);
            ctx.restore();
        }

        //Отрисовка дерева (всего)
        function drawFullTreeStatic() {
            const canvas = document.getElementById("graphCanvas");

            if(!canvas) return;

            canvas.width = 1060; canvas.height = 700;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0,0,canvas.width,canvas.height);

            for(const e of allEdges){
                let s = nodeMap.get(e.source), t = nodeMap.get(e.target);
                if(!s || !t) continue;
                let isLogic = s.type === "AND" || s.type === "OR";
                drawLine(ctx, s.x, s.y, t.x, t.y, isLogic ? "#d97706" : "#3b82f6", isLogic ? 2.2 : 1.8);
                if(e.prob !== null) drawEdgeLabel(ctx, s.x, s.y, t.x, t.y, `p${e.id}`);
            }

            for(const n of allNodes){
                if(n.type === "OR" || n.type === "AND") drawLogicNode(ctx, n.x, n.y, n.label, n.type);
                else drawEventNode(ctx, n.x, n.y, n.label, n.label === "R");
            }
        }
        
        //БЛОК АНИМАЦИИ
        let animationTabCounter = 0;
        const animationTabs = new Map();

        function cloneSimulationRuns() {
            return simulationRuns.map(run => ({
                runIndex: run.runIndex,
                generatedValues: { ...run.generatedValues },
                successes: { ...run.successes }
            }));
        }

        function stopAnimationTab(state) {
            if (!state) return;
            if (state.interval) {
                clearInterval(state.interval);
                state.interval = null;
            }
            state.isPlaying = false;
            const playBtn = document.getElementById(`playPauseAnimBtn_${state.id}`);
            if (playBtn) playBtn.textContent = "▶";
        }

        function getActiveNodesForRun(iterationIndex, runs = simulationRuns) {
            const candidateNodes = new Set(allNodes.map(node => node.id));
            const candidateEdges = new Set(allEdges.map(edge => edge.id));

            if (iterationIndex === 0) return {activeNodes: candidateNodes, activeEdges: candidateEdges};
            const iter = runs[iterationIndex - 1];
            if (!iter) return {activeNodes: new Set(), activeEdges: new Set()};

            for (const edge of probEdges) if (!iter.successes[edge.id]) candidateEdges.delete(edge.id);
            const logicNodes = allNodes.filter(node => node.type === "OR" || node.type === "AND").sort((a, b) => a.level - b.level);

            for (const logicNode of logicNodes) {
                const inEdges = allEdges.filter(edge => edge.target === logicNode.id);
                let removeHigher = false;
                if (logicNode.type === "OR") {
                    let count = 0;
                    for (const inEdge of inEdges){ if (!candidateEdges.has(inEdge.id)){ candidateNodes.delete(inEdge.source); count++; } }
                    removeHigher = count === inEdges.length;
                } else {
                    let flag = false;
                    for (const inEdge of inEdges) if (!candidateEdges.has(inEdge.id)) { flag = true; break; }
                    if (flag) { for (const inEdge of inEdges){ candidateEdges.delete(inEdge.id); candidateNodes.delete(inEdge.source); } removeHigher = true; }
                }
                if (removeHigher) {
                    candidateNodes.delete(logicNode.id);
                    const outEdge = allEdges.filter(edge => edge.source === logicNode.id)[0];
                    if(outEdge) { const outNode = allNodes.filter(node => node.id === outEdge.target)[0]; const outOutEdge = allEdges.filter(edge => edge.source === outNode?.id)[0]; candidateEdges.delete(outEdge.id); if(outNode) candidateNodes.delete(outNode.id); if(outOutEdge) candidateEdges.delete(outOutEdge.id); }
                }
            }

            const activeNodes = new Set();
            const activeEdges = new Set();
            const t0Node = allNodes.filter(node => node.label === "R")[0];
            if(!t0Node) return {activeNodes, activeEdges};
            let queue = [t0Node.id], visited = new Set([t0Node.id]);
            while (queue.length){
                const curr = queue.shift();
                activeNodes.add(curr);
                const inEdges = allEdges.filter(edge => edge.target === curr && candidateEdges.has(edge.id));
                for (const inEdge of inEdges) { if (!visited.has(inEdge.source)) { queue.push(inEdge.source); visited.add(inEdge.source); } activeEdges.add(inEdge.id); }
            }
            return {activeNodes, activeEdges};
        }

        function getAnimationPoint(node) {
            const scale = 1.18;
            const sourceCenterX = 530;
            const sourceCenterY = 350;
            const targetCenterX = 640;
            const targetCenterY = 440;
            return {
                x: targetCenterX + (node.x - sourceCenterX) * scale,
                y: targetCenterY + (node.y - sourceCenterY) * scale
            };
        }

        //отрисовка конкретного шага
        function drawAnimatedTreeForRun(step, canvasId = "animationCanvas", runs = simulationRuns, probs = fixedProbs, lowerBounds = fixedLowerBounds) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            canvas.width = 1280; canvas.height = 900;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            const { activeNodes, activeEdges } = getActiveNodesForRun(step, runs);
            for (const edge of allEdges) {
                if (!activeEdges.has(edge.id)) continue;
                const src = nodeMap.get(edge.source), tgt = nodeMap.get(edge.target);
                if(!src || !tgt) continue;
                const srcPoint = getAnimationPoint(src);
                const tgtPoint = getAnimationPoint(tgt);
                const isFromLogic = src.type === "AND" || src.type === "OR";
                drawLine(ctx, srcPoint.x, srcPoint.y, tgtPoint.x, tgtPoint.y, isFromLogic ? "#d97706" : "#3b82f6", isFromLogic ? 2.5 : 2);
                if (edge.prob !== null && step > 0 && runs[step-1]) {
                    const generatedValue = runs[step-1].generatedValues[edge.id];
                    if (generatedValue !== undefined) {
                        drawEdgeLabel(ctx, srcPoint.x, srcPoint.y, tgtPoint.x, tgtPoint.y, Number(generatedValue).toFixed(4));
                    }
                }
            }
            for (const node of allNodes) {
                if (!activeNodes.has(node.id)) continue;
                const point = getAnimationPoint(node);
                if (node.type === "OR" || node.type === "AND") drawLogicNode(ctx, point.x, point.y, node.label, node.type);
                else drawEventNode(ctx, point.x, point.y, node.label, node.label === "R");
            }
        }

        function startAnimationTab(state) {
            if (!state) return;
            if (state.interval) stopAnimationTab(state);
            const maxStep = state.runs.length;
            if (maxStep === 0) return;

            state.isPlaying = true;
            const playBtn = document.getElementById(`playPauseAnimBtn_${state.id}`);
            if (playBtn) playBtn.textContent = "⏸";

            state.interval = setInterval(() => {
                let nextStep = state.currentStep + 1;
                if (nextStep > maxStep) { nextStep = 0; }
                state.currentStep = nextStep;
                renderAnimationControls(state);
            }, state.speedMs);
        }

        function renderAnimationControls(state) {
            if(!state || !state.tabDiv) return;
            const maxStep = state.runs.length;
            state.tabDiv.innerHTML = `
                <div class="animation-controls">
                    <button id="animPrevBtn_${state.id}" class="outline">◀ Назад</button>
                    <div class="step-indicator">${state.currentStep} / ${maxStep}</div>
                    <button id="animNextBtn_${state.id}" class="outline">Вперед ▶</button>
                    <select id="speedSelect_${state.id}" class="speed-select">
                        <option value="250">0.25 сек</option>
                        <option value="500">0.5 сек</option>
                        <option value="1000">1 сек</option>
                        <option value="2000">2 сек</option>
                        <option value="3000">3 сек</option>
                        <option value="5000">5 сек</option>
                    </select>
                    <button id="playPauseAnimBtn_${state.id}" class="play-pause-btn">${state.isPlaying ? "⏸" : "▶"}</button>
                </div>
                <div id="canvas-container"><canvas id="animationCanvas_${state.id}" width="1280" height="900"></canvas></div>
            `;
            drawAnimatedTreeForRun(state.currentStep, `animationCanvas_${state.id}`, state.runs, state.probs, state.lowerBounds);
            const prevBtn = document.getElementById(`animPrevBtn_${state.id}`);
            const nextBtn = document.getElementById(`animNextBtn_${state.id}`);
            const playPauseBtn = document.getElementById(`playPauseAnimBtn_${state.id}`);
            const speedSelect = document.getElementById(`speedSelect_${state.id}`);

            if (prevBtn) prevBtn.addEventListener("click", () => { state.currentStep = state.currentStep > 0 ? state.currentStep - 1 : maxStep; stopAnimationTab(state); renderAnimationControls(state); });
            if (nextBtn) nextBtn.addEventListener("click", () => { state.currentStep = state.currentStep < maxStep ? state.currentStep + 1 : 0; stopAnimationTab(state); renderAnimationControls(state); });
            if (playPauseBtn) playPauseBtn.addEventListener("click", () => { if (state.isPlaying) { stopAnimationTab(state); renderAnimationControls(state); } else { startAnimationTab(state); renderAnimationControls(state); } });
            if (speedSelect) {
                speedSelect.value = state.speedMs;
                speedSelect.addEventListener("change", (e) => {
                    state.speedMs = parseInt(e.target.value, 10);
                    if (state.isPlaying) { stopAnimationTab(state); startAnimationTab(state); }
                });
            }
        }

        function activateTab(btn, tabDiv, onActivate) {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");

        function createAnimationTab() {
            if(simulationRuns.length === 0){ showNotification("Нет розыгрышей. Сначала запустите N розыгрышей.", false); return; }

            animationTabCounter += 1;
            const tabNumber = animationTabCounter;

            clearBtn.textContent = "✕";

            const tabDiv = document.createElement("div");
            tabDiv.id = `animationTab_${tabNumber}`;
            tabDiv.className = "tab";

            const state = {
                id,
                number: tabNumber,
                tabDiv,
                currentStep: 0,
                interval: null,
                isPlaying: false,
                speedMs: 1000,
                runs: cloneSimulationRuns(),
                probs: { ...fixedProbs },
                lowerBounds: { ...fixedLowerBounds }
            };
            animationTabs.set(id, state);

            clearBtn.onclick = () => {
                stopAnimationTab(state);
                animationTabs.delete(id);
                btn.remove();
                clearBtn.remove();
                tabDiv.remove();
                const first = document.querySelector(".tab-btn");
                if(first) first.click();
            };
            btn.onclick = () => activateTab(btn, tabDiv, () => renderAnimationControls(state));

            const docBtn = document.getElementById("documentationTabBtn");
            const docTab = document.getElementById("tab3");
            if (docBtn && docTab) {
                tabsContainer.insertBefore(btn, docBtn);
                tabsContainer.insertBefore(clearBtn, docBtn);
                tabContentContainer.insertBefore(tabDiv, docTab);
            } else {
                tabsContainer.appendChild(btn);
                tabsContainer.appendChild(clearBtn);
                tabContentContainer.appendChild(tabDiv);
            }

            btn.click();
        }

        function renderDocumentationTab() {
            let docTab = document.getElementById("tab3");

            if(!docTab){
                let btn = document.createElement("button");
                btn.type = "button";
                btn.className = "tab-btn";
                btn.id = "documentationTabBtn";
                btn.textContent = "Документация";
                docTab = document.createElement("div");
                docTab.id = "tab3";
                docTab.className = "tab";
                tabsContainer.appendChild(btn);
                tabContentContainer.appendChild(docTab);
                btn.onclick = () => {
                    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                    btn.classList.add("active");
                    docTab.classList.add("active");
                };
            }

            const tbody = documentationRows.map(row => `
                <tr>
                    <td>${row.code}</td>
                    <td>${row.name}</td>
                    <td>${row.category}</td>
                    <td>${row.formula}</td>
                </tr>
            `).join("");

            docTab.innerHTML = `
                <div class="docs-panel">
                    <div class="docs-intro">
                        <strong>Документация к графовой модели FTA</strong><br>
                        В таблице указаны расшифровки обозначений узлов дерева отказов для темы
                        «Прогнозирование характеристик безопасности функционирования авиационных транспортных систем
                        на основе моделей системной динамики».
                        <div class="docs-legend">
                            <span class="docs-badge">& = И</span>
                            <span class="docs-badge">1 = ИЛИ</span>
                            <span class="docs-badge">B = базовое событие</span>
                            <span class="docs-badge">S/F/G/R = промежуточные и итоговые события</span>
                        </div>
                    </div>
                    <div class="docs-table-container">
                        <table class="docs-table">
                            <thead>
                                <tr>
                                    <th>Код</th>
                                    <th>Название графа / события</th>
                                    <th>Раздел</th>
                                    <th>Формула входов</th>
                                </tr>
                            </thead>
                            <tbody>${tbody}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        //настройки жлементов
        const tabsContainer = document.getElementById("tabs");
        const tabContentContainer = document.getElementById("tabContent");
        const historyTabDiv = document.createElement("div"); historyTabDiv.id = "tab1"; historyTabDiv.className = "tab active";
        const histBtn = document.createElement("button"); histBtn.type = "button"; histBtn.className = "tab-btn active"; histBtn.textContent = "Таблица розыгрышей";

        histBtn.onclick = () => { document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active")); document.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); histBtn.classList.add("active"); historyTabDiv.classList.add("active"); };
        tabsContainer.appendChild(histBtn); tabContentContainer.appendChild(historyTabDiv);
        renderHistoryTableNew();
        buildTree();
        renderDocumentationTab();
    </script>
